# Netlify build and hosting config. Netlify builds every push to main (production)
# and every pull request (Deploy Preview) with these settings.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Set VITE_API_BASE_URL in the Netlify UI if you want to point at a different API;
  # the app falls back to https://dummyjson.com.

# Single-page app: any path that isn't a real file serves the app, so refreshing
# /products or opening a shared link doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # The sha256 hash allows exactly the inline theme script in index.html and nothing else.
    # If you edit that script, update the hash (src/test/csp.test.ts fails until you do).
    # style-src needs 'unsafe-inline' because Recharts and React set inline style attributes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-HK43DzzqgEmJgeDz2ZVNqeSOWz+9LKRRCxW6ff0q0Y0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://dummyjson.com https://cdn.dummyjson.com; connect-src 'self' https://dummyjson.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
